# H07P security hardening — host-wide ptrace scope.
#
# Install path (owner, root):  /etc/sysctl.d/60-agent-ptrace-scope.conf
# Then:                        sysctl --system
#
# Current state (measured): kernel.yama.ptrace_scope = 0
#
# Scope 0 lets any process attach to any other process with the same UID.
# All three worker components (worker-web-v7, dsh web, opencode.real) run as
# agents-worker UID 987, so scope 0 allows the credential-holding service to be
# inspected from the agent's own process tree.
#
# Scope 1 restricts ptrace to descendants only, which breaks sibling-to-sibling
# attach while leaving normal parent/child debugging intact.
#
# Trade-off: interactive debuggers (gdb/strace) attaching to unrelated
# same-UID processes stop working. Descendant debugging still works.
# Use scope 3 for a stricter posture if no same-UID debugging is needed.
#
# This complements the seccomp deny-list in
# systemd/70-memory-exfil-hardening.conf. Keep both: the sysctl covers processes
# outside the hardened units, seccomp covers the units' own trees.
kernel.yama.ptrace_scope = 1

[Service]
# =============================================================================
# H07P security hardening — N2 (core dump) + N3 (same-UID memory access)
#
# Applies to:  agent-workbench-dsh@.service
#              agent-workbench-opencode-web.service
#
# Install path (owner, root):
#   /etc/systemd/system/agent-workbench-dsh@.service.d/70-memory-exfil-hardening.conf
#   /etc/systemd/system/agent-workbench-opencode-web.service.d/70-memory-exfil-hardening.conf
#
# Filename MUST sort after the existing 20-/40-/50-/60- drop-ins so these
# scalar assignments win the last-one-wins resolution.
# =============================================================================

# N2 — credential leak through core dump.
# Both units currently report LimitCORE=infinity. The kernel core_pattern is
# the bare name "core", so a crash writes the full process image into the
# process CWD. For agent-workbench-dsh@3080 that CWD is
# /home/agents-worker/.agent-workbench-runtime-v6 — a directory the agent can
# read. The dumped image contains the live API keys held in RAM, so this path
# defeats any file-permission hardening of the credential store.
# LimitCORE=0 disables core dumps entirely for the whole unit process tree.
LimitCORE=0

# N3 — same-UID process memory access.
# kernel.yama.ptrace_scope=0 on this host, and /proc/<pid>/mem plus
# /proc/<pid>/environ are readable for every UID-987 process (verified for
# worker-web-v7, dsh web and opencode). Same UID therefore implies memory
# access. Seccomp filters are inherited across fork/exec and cannot be removed
# by an unprivileged child, so denying these syscalls here confines the whole
# service tree — including any command the agent runs.
#
#   ptrace             — classic attach; prerequisite for /proc/pid/mem
#   process_vm_readv   — direct cross-process memory read without ptrace
#   process_vm_writev  — direct cross-process memory write
#   pidfd_getfd        — steals an open file descriptor from another process,
#                        bypassing both path permissions and open handles
#   kcmp               — used to probe/compare other processes' resources
#
# The value is a deny-list and ACCUMULATES with the existing
# "SystemCallFilter=~syslog" from 40-codex-acp-sandbox.conf. Do not reset with
# an empty SystemCallFilter= assignment, or that syslog filter is lost.
#
# SYNTAX — the tilde appears ONCE, marking the whole assignment as a deny-list.
# Names after it must NOT carry a tilde. Writing "~ptrace ~kcmp" does not deny
# two syscalls: systemd reads "~kcmp" as a syscall *name*, fails to resolve it,
# and silently ignores the entry. A previous revision of this file made exactly
# that mistake, so the installed filter denied only "ptrace" while the unit
# reported nothing wrong. It surfaces only in `systemd-analyze verify` or
# `journalctl`:
#     System call ~process_vm_readv is not known, ignoring.
#
# VALIDATE IN A DISPOSABLE DEBIAN GUEST BEFORE TRUSTING THIS ON THE OWNER HOST.
# Bubblewrap/Landlock setup does not use these syscalls, but that is an
# expectation, not a measurement. If nested bubblewrap breaks, remove this one
# line and keep LimitCORE=0 plus the sysctl.
SystemCallFilter=~ptrace process_vm_readv process_vm_writev pidfd_getfd kcmp

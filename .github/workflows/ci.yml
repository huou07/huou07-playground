name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate framework links and skill structure
        run: python3 tools/check-framework.py
      - name: Check legacy behavior
        run: make check
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Generate lockfile only for initial bootstrap
        shell: bash
        run: |
          if [ -f Cargo.lock ]; then
            echo "A repository lockfile is present."
          else
            cargo +1.90.0 generate-lockfile
            echo "CARGO_LOCK_BOOTSTRAP=1" >> "$GITHUB_ENV"
          fi
      - name: Check Rust formatting
        shell: bash
        run: |
          if cargo +1.90.0 fmt --all -- --check; then
            exit 0
          fi
          cargo +1.90.0 fmt --all
          patch=$(git diff -- crates/server/src/main.rs | base64 -w0)
          echo "::error file=crates/server/src/main.rs,title=Rustfmt diff (base64)::$patch"
          exit 1
      - name: Lint Rust workspace
        run: cargo +1.90.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust workspace
        run: cargo +1.90.0 test --workspace --locked
      - name: Build Rust release binary
        run: cargo +1.90.0 build --workspace --release --locked
      - name: Smoke test Rust HTTP boundary
        run: bash tests/rust-smoke.sh target/release/h07p-server
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && env.CARGO_LOCK_BOOTSTRAP == '1'
        with:
          name: cargo-lock-bootstrap
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked browser test dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium on disposable runner
        run: npx --no-install playwright install --with-deps chromium
      - name: Check existing dashboard journeys
        run: make acceptance
